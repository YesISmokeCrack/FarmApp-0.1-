<!DOCTYPE html>
<html lang="ru">
 <!-- указываем язык для браузера -->
<head>
    <meta charset="UTF-8"> <!-- кодировка -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- для адаптации на мобильных -->
    <title>Ферма Учёт</title> <!-- заголовок вкладки браузера -->
    <!-- Bootstrap CSS (стили) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Наши собственные стили (пока немного) -->
    <style>
        body {
            padding-top: 70px; /* чтобы контент не прятался под фиксированную панель навигации */
            background-color: #f8f9fa; /* светло-серый фон */
        }

        .navbar {
            background-color: #2c3e50; /* тёмно-синий цвет для панели навигации */
        }

        .navbar-brand {
            color: white !important; /* белый текст для бренда */
            font-weight: bold;
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important; /* полупрозрачные белые ссылки */
        }

            .nav-link:hover {
                color: white !important; /* при наведении ярко-белый */
            }

        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* тень для карточек */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Навигационная панель (будет на всех страницах) -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <!-- логотип с иконкой трактора -->
            <a class="navbar-brand" href="/index.html"><i class="fas fa-tractor"></i> FarmApp</a>
            <!-- меню справа -->
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/pages/animals.html"><i class="fas fa-paw"></i> Животные</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/feeds.html"><i class="fas fa-seedling"></i> Корма</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/products.html"><i class="fas fa-cheese"></i> Продукция</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/sales.html"><i class="fas fa-shopping-cart"></i> Продажи</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Основной контейнер с контентом -->
    <div class="container">
        <h1 class="mb-4">Добро пожаловать в систему учёта фермы</h1>
        <!-- Сетка из 4 карточек -->
        <div class="row">
            <div class="col-md-3">
                <!-- на средних экранах каждая карточка занимает 3 колонки из 12 -->
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-paw fa-3x mb-3 text-primary"></i> <!-- иконка животного, увеличенная в 3 раза -->
                        <h5 class="card-title">Животные</h5>
                        <p class="card-text">Учёт поголовья, продуктивность</p>
                        <a href="/pages/animals.html" class="btn btn-primary">Перейти</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-seedling fa-3x mb-3 text-success"></i>
                        <h5 class="card-title">Корма</h5>
                        <p class="card-text">Управление запасами и расходом</p>
                        <a href="/pages/feeds.html" class="btn btn-success">Перейти</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-cheese fa-3x mb-3 text-warning"></i>
                        <h5 class="card-title">Продукция</h5>
                        <p class="card-text">Молоко, мясо, яйца</p>
                        <a href="/pages/products.html" class="btn btn-warning">Перейти</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <i class="fas fa-shopping-cart fa-3x mb-3 text-danger"></i>
                        <h5 class="card-title">Продажи</h5>
                        <p class="card-text">Оформление заказов</p>
                        <a href="/pages/sales.html" class="btn btn-danger">Перейти</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (необходим для работы некоторых компонентов, например, сворачивающегося меню) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт животных</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            padding-top: 70px;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #2c3e50;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .nav-link {
            color: rgba(255,255,255,0.8) !important;
        }

            .nav-link:hover {
                color: white !important;
            }

        .table th {
            background-color: #e9ecef;
        }
        /* делаем заголовки таблицы серыми */
    </style>
</head>
<body>
    <!-- Та же панель навигации (можно скопировать из index.html) -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/index.html"><i class="fas fa-tractor"></i> FarmApp</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/pages/animals.html"><i class="fas fa-paw"></i> Животные</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/feeds.html"><i class="fas fa-seedling"></i> Корма</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/products.html"><i class="fas fa-cheese"></i> Продукция</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pages/sales.html"><i class="fas fa-shopping-cart"></i> Продажи</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4"><i class="fas fa-paw"></i> Учёт животных</h1>

        <!-- Карточка с формой добавления -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="fas fa-plus-circle"></i> Добавить новое животное</h5>
            </div>
            <div class="card-body">
                <form id="animalForm">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="name" class="form-label">Кличка/номер</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="type" class="form-label">Вид</label>
                            <select class="form-select" id="type" required>
                                <option value="Cow">Корова</option>
                                <option value="Sheep">Овца</option>
                                <option value="Goat">Коза</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="breed" class="form-label">Порода</label>
                            <input type="text" class="form-control" id="breed">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="birthDate" class="form-label">Дата рождения</label>
                            <input type="date" class="form-control" id="birthDate" required>
                        </div>
                        <div class="col-md-1 mb-3">
                            <label for="gender" class="form-label">Пол</label>
                            <select class="form-select" id="gender" required>
                                <option value="Female">♀</option>
                                <option value="Male">♂</option>
                            </select>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label for="healthStatus" class="form-label">Статус</label>
                            <input type="text" class="form-control" id="healthStatus" value="Healthy">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Сохранить</button>
                </form>
            </div>
        </div>

        <!-- Карточка с таблицей -->
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="fas fa-list"></i> Список животных</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover" id="animalsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Кличка</th>
                            <th>Вид</th>
                            <th>Порода</th>
                            <th>Дата рождения</th>
                            <th>Пол</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="animalsBody">
                        <!-- Сюда будут вставлены строки через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Подключаем Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Наш собственный JavaScript для работы с животными -->
    <script src="/js/animals.js"></script>
</body>
</html>
